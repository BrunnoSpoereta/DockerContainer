<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login Circo Troller</title>
    <link rel="icon" href="SEO-MAQUINA-DE-INGRESSOS-removebg-preview.png" type="imagem-circo">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <img src="SEO-MAQUINA-DE-INGRESSOS-removebg-preview.png" alt="Logo do Circo Troller" class="logo">
            <h2>Bem-vindo ao Circo Troller</h2>
            <form>
                <div class="form-group">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuario" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha:" required>
                </div>
                <div class="button-group">
                    <button class=neu-button type="submit" onclick="window.location.href='arearestrita.html'">Login</button>
                    <button class=neu-button type="button">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
